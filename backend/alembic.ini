# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by the revision command
# and specified to the command line via the --autogenerate argument.
# revisions from feature branches tend to use longer names and/or
# have the idea that they may be a candidate for downgrading at some point.
# In those cases a long maxlen format will break down the argument parsing.
# set to 0 to disable, None to read this from the
# configuration as max_identifier_length
# max_identifier_length = 63

# set to 'true' to run the environment during the 'revision' command
# regardless of autogenerate flags
# on_version_conflict = raise
# compare_type = false
# compare_server_default = false
# render_as_batch = false

# set to 'true' to enable the -x considers-varchar-collation flag,
# which will augment the VARCHAR column type with a collation modifier.
# useful when authoring migrations for databases that use non-default collations.
# varchar_collation =

# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = INFO
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
